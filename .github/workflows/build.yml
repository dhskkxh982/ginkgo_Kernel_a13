name: Build Kernel
on: workflow_dispatch

env:
  DEFCONFIG: vendor/ginkgo-perf_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Get clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang $HOME/clang

      - name: Strip polly flags
        run: |
          sed -i -E 's/-mllvm[[:space:]]+-polly[A-Za-z0-9_=-]*//g' Makefile
          grep -n "polly" Makefile || echo "no polly left in Makefile"

      - name: Configure
        run: |
          export PATH=$HOME/clang/bin:$PATH
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- $DEFCONFIG
          S=scripts/config
          $S --file out/.config -d LLVM_POLLY
          $S --file out/.config -d MODULE_SIG -d MODULE_SIG_FORCE -d MODULE_SIG_ALL
          $S --file out/.config -e MODULE_FORCE_LOAD -e MODULE_FORCE_UNLOAD -e MODULE_UNLOAD
          $S --file out/.config -e IKCONFIG -e IKCONFIG_PROC
          $S --file out/.config -d CC_STACKPROTECTOR_STRONG -d CC_STACKPROTECTOR_REGULAR -e CC_STACKPROTECTOR_NONE
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          grep -E "MODULE_SIG|MODVERSIONS|FORCE_LOAD|STACKPROTECTOR|POLLY" out/.config

      - name: Build
        run: |
          export PATH=$HOME/clang/bin:$PATH
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-fno-stack-protector"

      - name: Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/README.md ak3/ramdisk ak3/patch ak3/modules
          cp out/arch/arm64/boot/Image.gz-dtb ak3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz ak3/
          cat > ak3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Ginkgo Custom Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=ginkgo
          device.name2=willow
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;

          dump_boot;
          write_boot;
          EOF
          sed -i 's/^          //' ak3/anykernel.sh
          cd ak3 && zip -r9 ../kernel.zip . -x ".git*"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            kernel.zip
            out/.config
